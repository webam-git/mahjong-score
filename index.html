<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀スコア計算ポータル</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 25px;
    }
    .menu-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.1s;
    }
    .menu-card:active {
      transform: scale(0.98);
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 5px;
    }
    .desc {
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>🀄️ 麻雀スコア管理ポータル</h1>

  <!-- 普段使い用リンク -->
  <a href="normal.html" class="menu-card">
    <div class="icon">📱</div>
    <div class="title">通常対局スコア計算</div>
    <div class="desc">1卓での普段の対局用。持ち点入力からチップ精算・履歴確認までスマホ内で完結します。</div>
  </a>

  <!-- 大会用リンク -->
  <a href="tournament.html" class="menu-card">
    <div class="icon">🏆</div>
    <div class="title">大会用スコア集計システム</div>
    <div class="desc">複数卓（A/B/C卓）のデータをリアルタイム送信・自動集計。結果発表用の閲覧ロック機能付き。</div>
  </a>

</body>
</html>
